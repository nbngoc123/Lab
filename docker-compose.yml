version: '3.8'

services:
  # 1. PostgreSQL - Data Warehouse
  # Cấu hình tài khoản và DB theo file 00_Prerequisite_CaiDat.ipynb
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dataeng
      POSTGRES_PASSWORD: dataeng123
      POSTGRES_DB: dwh
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. MinIO - Data Lake (S3-compatible)
  # Tài khoản minioadmin/minioadmin123, cổng console 9001, API 9000
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Script tự động tạo các bucket: raw, staging, curated khi MinIO bật lên
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/raw --ignore-existing;
      /usr/bin/mc mb myminio/staging --ignore-existing;
      /usr/bin/mc mb myminio/curated --ignore-existing;
      exit 0;
      "

  # 3. Apache Superset - BI Dashboard
  # Khởi tạo tự động tài khoản admin/admin như trong Notebook
  superset:
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: 'this_is_a_secret_key_for_superset'
    depends_on:
      - postgres
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin &&
      superset init &&
      gunicorn -w 2 --timeout 120 -b  0.0.0.0:8088 --limit-request-line 0 --limit-request-field_size 0 superset.app:create_app()
      "
    restart: unless-stopped

  # 4. Zookeeper và Kafka 
  # (Bổ sung thêm cho file kafka_attendance_simulator.py chạy cổng 9092)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  pg_data:
  minio_data:
