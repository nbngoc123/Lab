server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_image_name']
        target_label: 'image'

  - job_name: airflow_task_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: airflow_task_logs
          __path__: /opt/airflow/logs/*/*/*/*.log
          __path_exclude__: /opt/airflow/logs/scheduler/**/*.log
    pipeline_stages:
      - match:
          selector: '{job="airflow_task_logs"}'
          stages:
            - regex:
                expression: '/opt/airflow/logs/(?P<dag_id>[^/]+)/(?P<task_id>[^/]+)/.*'
                source: filename
            - labels:
                dag_id:
                task_id:
