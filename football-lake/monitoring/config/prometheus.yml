global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'airflow'
    static_configs:
      - targets: ['statsd-exporter:9102']

  - job_name: 'lake-exporter'
    static_configs:
      - targets: ['lake-exporter:9108']
