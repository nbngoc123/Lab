football_lake:
  target: dev
  outputs:
    dev:
      type: duckdb
      # ':memory:' => KHÔNG có file .duckdb dùng chung => không khoá giữa các DAG chạy song song, không dính
      # quyền ghi trên bind-mount. Mọi kết quả đã nằm ở MinIO (external). Cần debug cục bộ: DBT_DUCKDB_PATH=dev.duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', ':memory:') }}"
      threads: 4
      extensions:
        - httpfs
      settings:
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') | replace('http://', '') }}"
        s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY', 'minioadmin123') }}"
        s3_use_ssl: false
        s3_url_style: path
      external_root: "s3://football-lake/dwh"
