version: 2

models:
  - name: mart_bi_match_analysis
    description: >-
      Mart BI phân tích trận đấu, grain một dòng cho mỗi match_key từ fact_match.
      Không join, DISTINCT, lọc hoặc dedup; giữ nguyên tập dòng, khóa và metadata nguồn.
      Chỉ công bố tỷ số cuối, điểm quy ước 3/1/0 và cờ thắng/hòa/thua khi is_finished
      và đủ tỷ số hai phía (has_result). Trận kết thúc thiếu tỷ số có cờ riêng, không coi là thua.
      result giữ mã Core có điều kiện; core_result giữ nguyên mã nguồn để truy vết.
      Test cứng đối chiếu mã kết quả với tỷ số, không tính lại mã để che mâu thuẫn.
      Thống kê thực tế, tỷ số hiệp một và thời tiết lịch sử chỉ công bố khi is_finished;
      thiếu dữ liệu vẫn là NULL, không thay bằng 0. Phép cộng/trừ cần đủ hai thành phần;
      mọi chênh lệch là nhà trừ khách, không cộng gộp thẻ vàng và đỏ thành một chỉ số.
      Các cờ coverage dựa trên cột đã công bố, tính cả giá trị 0, không khẳng định hợp lệ vật lý.
      has_weather và in_* chỉ là hiện diện dòng nguồn, kể cả fixture chưa kết thúc.
      Giữ nguyên cú sút bất thường Burnley Championship 2024 (2,7) và West Ham EPL 2021 (8,9).
      Shot accuracy tương ứng có thể lớn hơn 1; cờ chất lượng là FALSE, test miền chỉ WARN.
      Không tự sửa, chặn tỷ lệ, loại dòng hoặc quy NULL cho bất thường; test công thức cờ là ERROR.
      Chưa có match_key chính xác của hai trường hợp để gắn regression test riêng từng trận.
      Đây là bảng thống kê sau trận, không phải dữ liệu biết trước trận cho ML.
      Không đưa Understat forecast vào như dự báo trước trận. Chưa có possession/passing,
      đội hình/chấn thương hoặc thống kê cầu thủ theo trận đáng tin cậy trong Core.
      PPDA/deep/xpts/npxg thuộc fact_team_match, không thuộc dependency trực tiếp của bản v1 này.
      Không đưa odds vào v1. Không suy giờ địa phương, sân trung lập hoặc thời lượng trận.
      season kế thừa mốc tháng 7 của Core; match_key không chứa giải, Core coalesce tỷ số theo nguồn.
      Tỷ số có thể trộn quy ước 90 phút/hiệp phụ/luân lưu; chưa đủ dữ liệu để chuẩn hóa ở Mart.
      Thời tiết Core lấy sân chính đội nhà, có thể không trùng venue_name hay sân thực tế.
      Dashboard quan hệ kết quả lọc has_result; hiển thị coverage, goals_conflict và chất lượng cú sút.
      Tổng hợp tỷ lệ bằng SUM tử/SUM mẫu trên cùng tập quan sát đủ hai thành phần,
      dùng NULLIF mẫu tổng bằng 0; không AVG đơn giản tỷ lệ từng trận hoặc tự bỏ dòng bất thường.
      SQL chỉ phụ thuộc fact_match; test nguồn cũng chỉ tham chiếu fact_match.
      Hai Mart trước được kiểm thử sandbox, chưa bảo đảm có Parquet BI chính thức.
      Đối soát độc lập sau này cần cả ba Mart trên cùng snapshot: unpivot nhà/khách so với Mart 1,
      gom competition_key/season/team_key theo has_result và cùng coverage để so với Mart 2.
      Kiểm thử sandbox phải xác minh external_root riêng và Core đầu vào có thể đọc;
      không chạy profile mặc định để kiểm thử, không tự rebuild Core.
      Theo macro hiện tại output mặc định là dwh/mart_bi_match_analysis.parquet,
      không phải đích được phép dùng trong kiểm thử sandbox.
      Kiểu nguồn được đối chiếu từ CAST/macro Core và staging: khóa/metadata VARCHAR,
      số đếm INTEGER, xG/thời tiết DOUBLE, ngày DATE, kickoff TIMESTAMP, cờ BOOLEAN.
      Đây là đối chiếu tĩnh, không phải xác nhận kiểu vật lý hoặc độ phủ Parquet runtime;
      không khai báo contract để ép kiểu dữ liệu chưa được kiểm tra.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fact_match')
      - dbt_utils.equality:
          compare_model: ref('fact_match')
          compare_columns: [match_key, competition_key, season, home_key, away_key, match_date, kickoff_utc, status, stage, matchday, af_round, referee, venue_name, is_finished, fdo_match_id, understat_match_id, af_fixture_id, openliga_match_id, goals_conflict, in_fdo, in_couk, in_understat, in_api_football, in_openliga, in_odds_api, has_weather]
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_distinct_teams
          expression: >-
            coalesce((home_key <> away_key), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_result_availability_matches_source
          expression: >-
            coalesce(((has_result) is not distinct from (match_key in (select match_key from {{ ref('fact_match') }} where is_finished and home_goals is not null and away_goals is not null))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_missing_final_score_matches_source
          expression: >-
            coalesce(((is_missing_final_score) is not distinct from (match_key in (select match_key from {{ ref('fact_match') }} where is_finished and (home_goals is null or away_goals is null)))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_core_result_preserved
          expression: >-
            coalesce(((core_result is null and match_key in (select match_key from {{ ref('fact_match') }} where result is null))
            or (core_result is not null and row(match_key, core_result) in (select row(match_key, result) from {{ ref('fact_match') }} where result is not null))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_final_scores_preserved
          expression: >-
            coalesce((not has_result or (home_goals is not null and away_goals is not null
            and row(match_key, home_goals, away_goals) in
            (select row(match_key, home_goals, away_goals) from {{ ref('fact_match') }}
             where is_finished and home_goals is not null and away_goals is not null))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_result_lifecycle
          expression: >-
            coalesce(((has_result and is_finished and home_goals is not null and away_goals is not null
             and result is not null and home_points is not null and away_points is not null
             and is_home_win is not null and is_draw is not null and is_away_win is not null)
            or (not has_result and home_goals is null and away_goals is null and result is null
             and home_points is null and away_points is null and is_home_win is null
             and is_draw is null and is_away_win is null and total_goals is null and goal_difference is null
             and home_goals_minus_xg is null and away_goals_minus_xg is null)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_result_matches_core_and_score
          expression: >-
            coalesce((not has_result or (result is not distinct from core_result and
             ((home_goals > away_goals and result = 'H')
              or (home_goals = away_goals and result = 'D')
              or (home_goals < away_goals and result = 'A')))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_points_match_score
          expression: >-
            coalesce((not has_result
            or (home_goals > away_goals and home_points = 3 and away_points = 0)
            or (home_goals = away_goals and home_points = 1 and away_points = 1)
            or (home_goals < away_goals and home_points = 0 and away_points = 3)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_outcome_flags
          expression: >-
            coalesce(((is_home_win) is not distinct from (case when has_result then (home_goals > away_goals)::integer end)
            and (is_draw) is not distinct from (case when has_result then (home_goals = away_goals)::integer end)
            and (is_away_win) is not distinct from (case when has_result then (home_goals < away_goals)::integer end)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_goal_arithmetic
          expression: >-
            coalesce(((total_goals) is not distinct from (case when has_result then home_goals + away_goals end)
            and (goal_difference) is not distinct from (case when has_result then home_goals - away_goals end)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_unfinished_actual_statistics_are_null
          expression: >-
            coalesce((is_finished or (ht_home_goals is null
            and ht_away_goals is null
            and home_xg is null
            and away_xg is null
            and home_shots is null
            and away_shots is null
            and home_shots_target is null
            and away_shots_target is null
            and home_corners is null
            and away_corners is null
            and home_fouls is null
            and away_fouls is null
            and home_yellows is null
            and away_yellows is null
            and home_reds is null
            and away_reds is null
            and weather_temp_c is null
            and weather_precip_mm is null
            and weather_wind_kmh is null
            and weather_humidity_pct is null
            and weather_code is null
            and total_xg is null
            and xg_difference is null
            and shots_difference is null
            and shots_target_difference is null
            and corners_difference is null
            and fouls_difference is null
            and yellows_difference is null
            and reds_difference is null
            and total_shots is null
            and total_shots_target is null
            and total_corners is null
            and total_fouls is null
            and total_yellows is null
            and total_reds is null
            and home_shot_accuracy is null
            and away_shot_accuracy is null)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_xg_arithmetic
          expression: >-
            coalesce(((total_xg) is not distinct from (home_xg + away_xg)
            and (xg_difference) is not distinct from (home_xg - away_xg)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_xg_source_values_preserved
          expression: >-
            coalesce((((home_xg is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or home_xg is null))
            or (home_xg is not null and row(match_key, home_xg) in
             (select row(match_key, home_xg) from {{ ref('fact_match') }} where is_finished and home_xg is not null)))
            and ((away_xg is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or away_xg is null))
            or (away_xg is not null and row(match_key, away_xg) in
             (select row(match_key, away_xg) from {{ ref('fact_match') }} where is_finished and away_xg is not null)))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_shots_arithmetic
          expression: >-
            coalesce(((total_shots) is not distinct from (home_shots + away_shots)
            and (shots_difference) is not distinct from (home_shots - away_shots)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_shots_source_values_preserved
          expression: >-
            coalesce((((home_shots is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or home_shots is null))
            or (home_shots is not null and row(match_key, home_shots) in
             (select row(match_key, home_shots) from {{ ref('fact_match') }} where is_finished and home_shots is not null)))
            and ((away_shots is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or away_shots is null))
            or (away_shots is not null and row(match_key, away_shots) in
             (select row(match_key, away_shots) from {{ ref('fact_match') }} where is_finished and away_shots is not null)))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_shots_target_arithmetic
          expression: >-
            coalesce(((total_shots_target) is not distinct from (home_shots_target + away_shots_target)
            and (shots_target_difference) is not distinct from (home_shots_target - away_shots_target)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_shots_target_source_values_preserved
          expression: >-
            coalesce((((home_shots_target is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or home_shots_target is null))
            or (home_shots_target is not null and row(match_key, home_shots_target) in
             (select row(match_key, home_shots_target) from {{ ref('fact_match') }} where is_finished and home_shots_target is not null)))
            and ((away_shots_target is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or away_shots_target is null))
            or (away_shots_target is not null and row(match_key, away_shots_target) in
             (select row(match_key, away_shots_target) from {{ ref('fact_match') }} where is_finished and away_shots_target is not null)))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_corners_arithmetic
          expression: >-
            coalesce(((total_corners) is not distinct from (home_corners + away_corners)
            and (corners_difference) is not distinct from (home_corners - away_corners)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_corners_source_values_preserved
          expression: >-
            coalesce((((home_corners is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or home_corners is null))
            or (home_corners is not null and row(match_key, home_corners) in
             (select row(match_key, home_corners) from {{ ref('fact_match') }} where is_finished and home_corners is not null)))
            and ((away_corners is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or away_corners is null))
            or (away_corners is not null and row(match_key, away_corners) in
             (select row(match_key, away_corners) from {{ ref('fact_match') }} where is_finished and away_corners is not null)))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_fouls_arithmetic
          expression: >-
            coalesce(((total_fouls) is not distinct from (home_fouls + away_fouls)
            and (fouls_difference) is not distinct from (home_fouls - away_fouls)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_fouls_source_values_preserved
          expression: >-
            coalesce((((home_fouls is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or home_fouls is null))
            or (home_fouls is not null and row(match_key, home_fouls) in
             (select row(match_key, home_fouls) from {{ ref('fact_match') }} where is_finished and home_fouls is not null)))
            and ((away_fouls is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or away_fouls is null))
            or (away_fouls is not null and row(match_key, away_fouls) in
             (select row(match_key, away_fouls) from {{ ref('fact_match') }} where is_finished and away_fouls is not null)))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_yellows_arithmetic
          expression: >-
            coalesce(((total_yellows) is not distinct from (home_yellows + away_yellows)
            and (yellows_difference) is not distinct from (home_yellows - away_yellows)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_yellows_source_values_preserved
          expression: >-
            coalesce((((home_yellows is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or home_yellows is null))
            or (home_yellows is not null and row(match_key, home_yellows) in
             (select row(match_key, home_yellows) from {{ ref('fact_match') }} where is_finished and home_yellows is not null)))
            and ((away_yellows is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or away_yellows is null))
            or (away_yellows is not null and row(match_key, away_yellows) in
             (select row(match_key, away_yellows) from {{ ref('fact_match') }} where is_finished and away_yellows is not null)))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_reds_arithmetic
          expression: >-
            coalesce(((total_reds) is not distinct from (home_reds + away_reds)
            and (reds_difference) is not distinct from (home_reds - away_reds)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_reds_source_values_preserved
          expression: >-
            coalesce((((home_reds is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or home_reds is null))
            or (home_reds is not null and row(match_key, home_reds) in
             (select row(match_key, home_reds) from {{ ref('fact_match') }} where is_finished and home_reds is not null)))
            and ((away_reds is null and match_key in
             (select match_key from {{ ref('fact_match') }} where not is_finished or away_reds is null))
            or (away_reds is not null and row(match_key, away_reds) in
             (select row(match_key, away_reds) from {{ ref('fact_match') }} where is_finished and away_reds is not null)))), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_goals_minus_xg
          expression: >-
            coalesce(((home_goals_minus_xg) is not distinct from (case when has_result then home_goals - home_xg end)
            and (away_goals_minus_xg) is not distinct from (case when has_result then away_goals - away_xg end)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_statistic_pair_coverage
          expression: >-
            coalesce(((has_xg_pair) is not distinct from (home_xg is not null and away_xg is not null)
            and (has_shots_pair) is not distinct from (home_shots is not null and away_shots is not null)
            and (has_shots_target_pair) is not distinct from (home_shots_target is not null and away_shots_target is not null)
            and (has_corners_pair) is not distinct from (home_corners is not null and away_corners is not null)
            and (has_fouls_pair) is not distinct from (home_fouls is not null and away_fouls is not null)
            and (has_yellows_pair) is not distinct from (home_yellows is not null and away_yellows is not null)
            and (has_reds_pair) is not distinct from (home_reds is not null and away_reds is not null)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_home_shots_quality_flag
          expression: >-
            coalesce(((home_shots_pair_valid) is not distinct from (case when home_shots is not null and home_shots_target is not null
             then (home_shots >= 0 and home_shots_target >= 0 and home_shots_target <= home_shots) end)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_home_shot_accuracy
          expression: >-
            coalesce(((home_shots is null or home_shots_target is null or home_shots = 0)
             and home_shot_accuracy is null
            or (home_shots is not null and home_shots_target is not null and home_shots <> 0
             and home_shot_accuracy is not null
             and abs(home_shot_accuracy - 1.0 * home_shots_target / nullif(home_shots, 0)) < 0.00000001)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_home_shots_physical_domain
          expression: >-
            coalesce(((home_shots is null or home_shots >= 0)
            and (home_shots_target is null or home_shots_target >= 0)
            and (home_shots is null or home_shots_target is null or home_shots_target <= home_shots)), false)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_away_shots_quality_flag
          expression: >-
            coalesce(((away_shots_pair_valid) is not distinct from (case when away_shots is not null and away_shots_target is not null
             then (away_shots >= 0 and away_shots_target >= 0 and away_shots_target <= away_shots) end)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_away_shot_accuracy
          expression: >-
            coalesce(((away_shots is null or away_shots_target is null or away_shots = 0)
             and away_shot_accuracy is null
            or (away_shots is not null and away_shots_target is not null and away_shots <> 0
             and away_shot_accuracy is not null
             and abs(away_shot_accuracy - 1.0 * away_shots_target / nullif(away_shots, 0)) < 0.00000001)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_away_shots_physical_domain
          expression: >-
            coalesce(((away_shots is null or away_shots >= 0)
            and (away_shots_target is null or away_shots_target >= 0)
            and (away_shots is null or away_shots_target is null or away_shots_target <= away_shots)), false)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_calendar_fields
          expression: >-
            coalesce(((match_year) is not distinct from (date_part('year', match_date)::integer)
            and (match_month) is not distinct from (date_part('month', match_date)::integer)
            and (match_day_of_week) is not distinct from (date_part('isodow', match_date)::integer)
            and (is_weekend) is not distinct from (date_part('isodow', match_date) in (6, 7))
            and (kickoff_hour_utc) is not distinct from (date_part('hour', kickoff_utc)::integer)), false)
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_counts_nonnegative
          expression: >-
            coalesce(((home_goals is null or home_goals >= 0)
            and (away_goals is null or away_goals >= 0)
            and (ht_home_goals is null or ht_home_goals >= 0)
            and (ht_away_goals is null or ht_away_goals >= 0)
            and (home_corners is null or home_corners >= 0)
            and (away_corners is null or away_corners >= 0)
            and (home_fouls is null or home_fouls >= 0)
            and (away_fouls is null or away_fouls >= 0)
            and (home_yellows is null or home_yellows >= 0)
            and (away_yellows is null or away_yellows >= 0)
            and (home_reds is null or home_reds >= 0)
            and (away_reds is null or away_reds >= 0)), false)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_xg_nonnegative
          expression: >-
            coalesce(((home_xg is null or home_xg >= 0) and (away_xg is null or away_xg >= 0)), false)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_source_score_agreement
          expression: >-
            coalesce((not goals_conflict), false)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_finished_score_coverage
          expression: >-
            coalesce((not is_missing_final_score), false)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: mart_bi_match_analysis_weather_physical_domain
          expression: >-
            coalesce(((weather_precip_mm is null or weather_precip_mm >= 0)
            and (weather_wind_kmh is null or weather_wind_kmh >= 0)
            and (weather_humidity_pct is null or weather_humidity_pct between 0 and 100)), false)
          config:
            severity: warn
    columns:
      - name: match_key
        description: "Khóa trận kế thừa Core: MD5 của đội nhà, đội khách và ngày; không bao gồm giải."
        tests:
          - not_null
          - unique
          - relationships: {to: ref('fact_match'), field: match_key}
      - name: competition_key
        description: "Khóa giải từ Core; không tự ánh xạ hoặc sửa giải."
        tests:
          - not_null
      - name: season
