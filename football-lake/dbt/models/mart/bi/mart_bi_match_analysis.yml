        description: "Mã H/D/A nguyên bản từ fact_match.result, kể cả NULL hoặc giá trị mâu thuẫn. Chỉ dùng truy vết; test cứng đối chiếu với tỷ số, không sửa mã Core."
      - name: home_goals
