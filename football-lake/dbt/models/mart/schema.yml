version: 2

models:
  - name: mart_ml_match_features
    description: "ML mart chính: 1 dòng / trận. f_* = đặc trưng trước giờ đá, y_* = nhãn sau trận. Chia split theo thời gian."
    columns:
      - name: match_key
        tests: [not_null, unique]
      - name: split
        tests:
          - not_null
          - accepted_values: {values: ['train', 'valid', 'test', 'predict']}
      - name: y_result
        tests:
          - accepted_values: {values: ['H', 'D', 'A']}
  - name: mart_ml_team_match_features
    description: "Bảng dài: 1 trận -> 2 dòng, phong độ đội tính đúng thời điểm trước trận (ASOF join)."
    columns:
      - name: team_match_key
        tests: [not_null, unique]
  - name: mart_ml_match_attention
    description: "Bảng PHỤ (join tuỳ chọn): lượt xem Wikipedia 7/28 ngày trước trận; chỉ trận mà ít nhất 1 đội có dữ liệu."
    columns:
      - name: match_key
        tests: [not_null, unique]
  - name: mart_ml_text_google_news
    description: "TEXT ML tách riêng (không nối đội/trận): Google News, 1 dòng / bài."
    columns:
      - name: news_id
        tests: [not_null, unique]
  - name: mart_ml_text_football_news
    description: "TEXT ML tách riêng: football_news, 1 dòng / bài (md5(url))."
    columns:
      - name: news_id
        tests: [not_null, unique]
  - name: mart_ml_text_youtube_videos
    description: "TEXT ML tách riêng: video YouTube, kèm thống kê bình luận theo video_id."
    columns:
      - name: video_id
        tests: [not_null, unique]
  - name: mart_ml_text_youtube_comments
    description: "TEXT ML tách riêng: bình luận YouTube kèm ngữ cảnh video cha."
    columns:
      - name: comment_id
        tests: [not_null, unique]
  - name: mart_ml_text_wikipedia
    description: "TEXT ML tách riêng: bài Wikipedia (nội dung dài)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [page_id, language, category]
  - name: mart_ml_goals
    columns:
      - name: goal_id
        tests: [not_null, unique]
  - name: mart_ml_shots
    columns:
      - name: shot_id
        tests: [not_null, unique]
