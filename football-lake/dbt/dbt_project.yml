name: 'football_lake'
version: '1.0.0'
config-version: 2

profile: 'football_lake'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["../seed"]   # Dùng chung seed/team_alias.csv với lake/team_lookup.py
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "{{ env_var('DBT_TARGET_PATH', 'target') }}"
log-path: "{{ env_var('DBT_LOG_PATH', 'logs') }}"

# Mỗi lần chạy dbt dùng DuckDB TRONG BỘ NHỌ (xem profiles.yml). Model nào KHÔNG nằm trong lần chạy này mà là upstream
# kiểu `external` (vd core đọc staging) sẽ được đăng ký thành view trỏ thẳng vào file Parquet trên MinIO.
on-run-start:
  - "{{ register_upstream_external_models() }}"

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  lake_bucket: football-lake
  # p26 OpenLigaDB: chỉ lấy mùa >= giá trị này ở staging (worker backfill có thể nạp sâu hơn)
  openliga_min_season: 2024
  # non_team_keys: các giá trị không phải tên CLB thật (bộ lọc cho audit)
  # Mart ML ---------------------------------------------------------------------------------------------
  ml_min_match_date: '2000-01-01'   # bỏ trận có ngày placeholder (OpenLigaDB có giải rác với ngày 1970-01-01)
  ml_min_history: 5          # is_warm: cả 2 đội cần >= N trận trước đó
  ml_train_until: 0.70       # chia theo thời gian trên các trận đã có nhãn: <0.70 train, <0.85 valid, còn lại test
  ml_valid_until: 0.85
  non_team_keys: "('unknown','Bundesliga','La Liga','Ligue 1','Premier League','Serie A','Champions League','European Championship','FIFA World Cup')"

seeds:
  football_lake:
    +schema: core
    team_alias:
      +column_types: {source: varchar, alias: varchar, team_key: varchar}

models:
  football_lake:
    staging:
      +schema: staging
      +materialized: external
    core:
      +schema: core
      +materialized: external
    mart:
      +schema: mart
      +materialized: external
