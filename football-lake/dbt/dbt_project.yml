name: 'football_lake'
version: '1.0.0'
config-version: 2

profile: 'football_lake'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  lake_bucket: football-lake
  # Bật thành 'true' khi đã có code ingest ghi các raw path tương ứng, để tránh dbt lỗi glob rỗng
  has_fdo_competitions: true
  has_fdo_teams: true
  has_fdo_standings: true
  has_thesportsdb_players: true

models:
  football_lake:
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: table
    mart:
      +schema: mart
      +materialized: table
